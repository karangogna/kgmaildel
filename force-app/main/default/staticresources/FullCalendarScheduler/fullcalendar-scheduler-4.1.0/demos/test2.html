<!DOCTYPE html>
<html lang='en'>
  <head>
    <meta charset='utf-8' />

    <link href='../packages/core/main.css' rel='stylesheet' />

    <link href='../packages/daygrid/main.css' rel='stylesheet' />
    
    <link href='../packages/timegrid/main.css' rel='stylesheet' />
    
    <link href='../packages/timeline/main.css' rel='stylesheet' />
    
    <link href='../packages/resource-timeline/main.css' rel='stylesheet' />
    
    <script src='../packages/core/main.js'></script>
    
    <script src='../packages/interaction/main.js'></script>
    
    <script src='../packages/daygrid/main.js'></script>
    
    <script src='../packages/timegrid/main.js'></script>
    
    <script src='../packages/timeline/main.js'></script>
    
    <script src='../packages/resource-common/main.js'></script>
    
    <script src='../packages/resource-timeline/main.js'></script>

    <script>

      document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');

        var calendar = new FullCalendar.Calendar(calendarEl, {
          plugins: [ 'interaction', 'dayGrid', 'resourceTimeline'],
          schedulerLicenseKey: 'GPL-My-Project-Is-Open-Source',
          defaultView: 'resourceTimeline',
          dateClick: function(info) {
              console.log('clicked on ' + info.dateStr);
              console.log('resource id: ' + info.resource.id);
          },
          resources: [
            { id: 'a', title: 'Auditorium A' },
            { id: 'b', title: 'Auditorium B'}
          ],
          events: [
            {id: 'be1', resourceId: 'b', start: '2019-04-30T01:00:00', end: '2019-04-30T04:00:00'}
          ]
        });

        calendar.render();
      });

    </script>
  </head>
  <body>

    <div id='calendar'></div>

  </body>
</html>
